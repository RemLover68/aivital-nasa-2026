<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preaviso, riesgo de incendios</title>
  <meta name="description" content="Cola de incendios del día por prioridad, mapa, causas y activos en el camino. Apoyo a la decisión.">
  <link rel="icon" href="img/icono.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/despacho.css">
</head>
<body>
  <a class="salto" href="#abrir-cola">Saltar a la cola</a>
  <header class="barra">
    <a class="marca" href="index.html"><img class="logo-emblema" src="img/logo-emblema.png" alt="" width="839" height="658"><img class="logo-nombre" src="img/logo-nombre.png" alt="Preaviso" width="1277" height="234"><small>Riesgo de incendios</small></a>
    <div class="ctl">
      <div class="grupo" role="radiogroup" aria-label="Día" id="dias"></div>
      <label class="campo">Región
        <select id="region"></select>
      </label>
    </div>
    <span class="sello" id="sello" hidden>Datos de ejemplo</span>
  </header>

  <main class="sala">
    <aside class="tablero" id="tablero" aria-label="Tablero de acierto"></aside>
    <section class="centro" aria-label="Mapa">
      <div id="mapa" class="mapa"></div>
      <button type="button" class="abrir-cola" id="abrir-cola" aria-expanded="false" aria-controls="cola">Cola de incendios <b id="btn-cola-n"></b> <span class="flecha" aria-hidden="true"></span></button>
      <section class="cola" id="cola" aria-labelledby="cola-t" tabindex="-1" hidden>
        <h2 id="cola-t" class="etq">Cola por prioridad <span id="cola-n"></span></h2>
        <ol id="lista" class="lista"></ol>
      </section>
      <div class="ley"><strong>Probabilidad de no control el día de inicio</strong>
        <div class="rampa" id="rampa"></div>
        <p>Tamaño del punto: prioridad en la cola.</p></div>
      <aside class="tarjeta" id="tarjeta" aria-live="polite" aria-label="Incendio elegido" hidden></aside>
    </section>
  </main>
  <p class="aviso">Apoyo a la decisión: la probabilidad no es una certeza ni una orden operativa. No emite alertas a la población.</p>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/despacho.js"></script>
</body>
</html>
